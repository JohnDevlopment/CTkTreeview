[project]
name = "CTkTreeview"
version = "0.1.0"
description = "A Treeview widget for customtkinter (extension/add-on)"
authors = [{ name = "JohnDevlopment", email = "50782633+JohnDevlopment@users.noreply.github.com" }]
requires-python = ">=3.10,<4"
readme = "README.md"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "customtkinter>=5.2.2,<6",
    "attrs>=24.2.0,<25",
    "typing-extensions>=4.12.2,<5",
]

[dependency-groups]
dev = [
    "icecream>=2.1.3,<3",
    "basedpyright>=1.17.0,<2",
    "pylint>=3.3.1,<4",
]
doc = [
    "sphinx>=8.0.2,<9",
    "sphinx-rtd-theme<2.0.0",
]

[build-system]
requires = ["uv_build>=0.9.30,<0.10.0"]
build-backend = "uv_build"

[tool.basedpyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
